<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jake Fantom | Поддержка стрима</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2e2e2e;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: none;
        }

        /* ========== АНИМИРОВАННЫЙ ФОН С ГРАДИЕНТОМ ========== */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #2e2e2e, #1a1a1a, #0d3d1f, #2e2e2e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ========== КАСТОМНЫЙ КУРСОР ========== */
        .custom-cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid #00ff04;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(0, 255, 4, 0.8);
            transition: width 0.2s, height 0.2s;
        }

        .custom-cursor::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #00ff04;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00ff04;
        }

        .custom-cursor.click {
            width: 50px;
            height: 50px;
            border-color: #07eb0f;
        }

        /* Класс для отключения кастомного курсора */
        body.default-cursor {
            cursor: auto;
        }

        body.default-cursor .custom-cursor {
            display: none;
        }

        /* ========== МАТРИЧНЫЙ ДОЖДЬ ========== */
        #skullCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        /* ========== ОСНОВНОЙ КОНТЕЙНЕР ========== */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .content-box {
            background: rgba(46, 46, 46, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #00ff04;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 4, 0.3),
                        inset 0 0 30px rgba(7, 235, 15, 0.1);
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 4, 0.3), inset 0 0 30px rgba(7, 235, 15, 0.1); }
            50% { box-shadow: 0 0 50px rgba(0, 255, 4, 0.5), inset 0 0 50px rgba(7, 235, 15, 0.2); }
        }

        /* ========== АВАТАР ========== */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00ff04;
            box-shadow: 0 0 30px rgba(0, 255, 4, 0.6);
            animation: avatarPulse 2s ease-in-out infinite;
        }

        @keyframes avatarPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0, 255, 4, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(0, 255, 4, 0.8); }
        }

        /* ========== ЧЕРЕПА ДЕКОР ========== */
        .skull-decor {
            position: absolute;
            font-size: 24px;
            color: #07eb0f;
            opacity: 0.6;
            animation: float 4s ease-in-out infinite;
        }

        .skull-decor:nth-child(1) { top: 10px; left: 10px; animation-delay: 0s; }
        .skull-decor:nth-child(2) { top: 10px; right: 10px; animation-delay: 1s; }
        .skull-decor:nth-child(3) { bottom: 10px; left: 10px; animation-delay: 2s; }
        .skull-decor:nth-child(4) { bottom: 10px; right: 10px; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        /* ========== GLITCH-ЭФФЕКТ ========== */
        .glitch-title {
            font-size: 32px;
            margin-bottom: 15px;
            color: #00ff04;
            text-shadow: 0 0 20px rgba(0, 255, 4, 0.8);
            letter-spacing: 1px;
            position: relative;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow: 0 0 20px rgba(0, 255, 4, 0.8);
                transform: translate(0);
            }
            20% {
                text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff;
                transform: translate(-2px, 2px);
            }
            40% {
                text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff;
                transform: translate(2px, -2px);
            }
            60% {
                text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff;
                transform: translate(-1px, 1px);
            }
            80% {
                text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff;
                transform: translate(1px, -1px);
            }
        }

        /* ========== АНИМАЦИЯ ПЕЧАТАНИЯ ========== */
        .typing-text {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 25px;
            line-height: 1.6;
            min-height: 60px;
        }

        .typing-text::after {
            content: '|';
            animation: blink 1s infinite;
            color: #00ff04;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ========== МИНИМАЛЬНАЯ СУММА (КОМПАКТНАЯ) ========== */
        .min-donate-info {
            display: inline-block;
            background: rgba(0, 255, 4, 0.05);
            border: 1px solid #0da64d;
            border-radius: 10px;
            padding: 12px 25px;
            margin: 20px 0;
        }

        .min-donate-label {
            font-size: 12px;
            color: #07eb0f;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .min-donate-amount {
            font-size: 28px;
            font-weight: 700;
            color: #00ff04;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .min-donate-amount .currency {
            font-size: 20px;
        }

        /* ========== ПЕРЕКЛЮЧАТЕЛЬ ПЛАТФОРМ ========== */
        .platform-switcher {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .platform-btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 25px;
            border: 2px solid #0da64d;
            background: rgba(0, 0, 0, 0.4);
            color: #07eb0f;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .platform-btn:hover {
            background: rgba(13, 166, 77, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(13, 166, 77, 0.4);
        }

        .platform-btn.active {
            background: #00ff04;
            color: #2e2e2e;
            border-color: #00ff04;
            box-shadow: 0 0 25px rgba(0, 255, 4, 0.8);
            transform: scale(1.05);
        }

        /* ========== БЛОК С ВИДЖЕТАМИ ========== */
        .widget-wrapper {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #0da64d;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(13, 166, 77, 0.3);
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .widget-container {
            width: 100%;
            display: none;
        }

        .widget-container.active {
            display: block;
        }

        .widget-container iframe {
            border-radius: 10px;
            max-width: 100%;
        }

        .da-button {
            display: inline-block;
            padding: 20px 40px;
            background: linear-gradient(135deg, #04a54b 0%, #07eb0f 100%);
            color: #2e2e2e;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
            border: 2px solid #00ff04;
            box-shadow: 0 0 30px rgba(0, 255, 4, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: none;
        }

        .da-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 40px rgba(0, 255, 4, 0.9);
        }

        /* ========== СОЦИАЛЬНЫЕ ССЫЛКИ ========== */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .social-btn {
            text-decoration: none;
            color: #00ff04;
            background: rgba(0, 255, 4, 0.1);
            border: 2px solid #00ff04;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: none;
        }

        .social-btn:hover {
            background: #00ff04;
            color: #2e2e2e;
            box-shadow: 0 0 25px rgba(0, 255, 4, 0.8);
            transform: translateY(-3px);
        }

        /* ========== СЕКРЕТНЫЙ РЕЖИМ (СКРЫТЫЙ КОНТЕНТ) ========== */
        .secret-content {
            display: none;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00ff04;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 0 40px rgba(0, 255, 4, 0.6);
            animation: secretReveal 0.5s ease-out;
        }

        .secret-content.active {
            display: block;
        }

        @keyframes secretReveal {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .secret-title {
            font-size: 24px;
            color: #00ff04;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 4, 0.8);
        }

        .secret-video {
            width: 100%;
            max-width: 560px;
            margin: 0 auto 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 4, 0.5);
        }

        .secret-video iframe {
            width: 100%;
            height: 315px;
            border: none;
        }

        .secret-message {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .close-secret {
            padding: 12px 30px;
            background: #00ff04;
            color: #2e2e2e;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-secret:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 4, 0.8);
        }

        /* ========== ЧАСТИЦЫ ПРИ КЛИКЕ ========== */
        .click-particle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: #00ff04;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            box-shadow: 0 0 10px #00ff04;
        }

        /* ========== ПЛАВАЮЩИЕ ЧАСТИЦЫ ========== */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #07eb0f;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            box-shadow: 0 0 10px #07eb0f;
        }

        /* ========== АДАПТИВНОСТЬ ========== */
        @media (max-width: 600px) {
            .content-box {
                padding: 30px 20px;
            }
            .glitch-title {
                font-size: 24px;
            }
            .avatar-container {
                width: 120px;
                height: 120px;
            }
            .platform-btn {
                min-width: 100%;
            }
            .min-donate-amount {
                font-size: 24px;
            }
            .custom-cursor {
                display: none;
            }
            body {
                cursor: auto;
            }
            .secret-video iframe {
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- Анимированный фон -->
    <div class="animated-bg"></div>

    <!-- Кастомный курсор -->
    <div class="custom-cursor"></div>

    <!-- Canvas для матричного дождя -->
    <canvas id="skullCanvas"></canvas>

    <!-- Плавающие частицы -->
    <div id="particles"></div>

    <div class="container">
        <div class="content-box">
            <!-- Декоративные черепа и надгробия -->
            <div class="skull-decor"></div>
            <div class="skull-decor">🪦</div>
            <div class="skull-decor">💀</div>
            <div class="skull-decor">🪦</div>

            <!-- Аватар -->
            <div class="avatar-container">
                <img src="https://i.imgur.com/zLAns40.png" alt="Jake Fantom Avatar" class="avatar">
            </div>

            <!-- Заголовок с glitch-эффектом -->
            <h1 class="glitch-title"> JAKE FANTOM </h1>
            
            <!-- Текст с анимацией печатания -->
            <p class="typing-text" id="typingText"></p>

            <!-- Минимальная сумма доната (компактная) -->
            <div class="min-donate-info">
                <div class="min-donate-label">Минимальный донат</div>
                <div class="min-donate-amount">
                    <span>30</span>
                    <span class="currency">₽</span>
                </div>
            </div>

            <!-- Переключатель платформ -->
            <div class="platform-switcher">
                <button class="platform-btn active" onclick="switchPlatform('donatepay')">
                    💚 DonatePay
                </button>
                <button class="platform-btn" onclick="switchPlatform('donationalerts')">
                    🔔 DonationAlerts
                </button>
            </div>

            <!-- Блок с виджетами -->
            <div class="widget-wrapper">
                <!-- DONATEPAY -->
                <div id="donatepay-widget" class="widget-container active">
                    <iframe 
                        src="https://widget.donatepay.ru/widgets/page/24b44dc68e48fb37a2f23d99c8e52a1e83f83ce59ca35b9c87a04ee09fd217c3?widget_id=7869312&sum=200" 
                        width="510" 
                        height="220" 
                        frameBorder="0"
                        scrolling="no"
                    ></iframe>
                </div>

                <!-- DONATIONALERTS -->
                <div id="donationalerts-widget" class="widget-container">
                    <a href="https://www.donationalerts.com/r/jakefantom" target="_blank" class="da-button">
                         Перейти к донату
                    </a>
                    <p style="margin-top: 20px; color: #b0b0b0; font-size: 14px;">
                        Откроется в новой вкладке
                    </p>
                </div>
            </div>

            <!-- СЕКРЕТНЫЙ КОНТЕНТ (скрыт по умолчанию) -->
            <div class="secret-content" id="secretContent">
                <h2 class="secret-title"> СЕКРЕТНЫЙ КОНТЕНТ РАЗБЛОКИРОВАН! </h2>
                <p class="secret-message">
                    Ты нашёл пасхалку! Вот эксклюзивное видео только для настоящих фанатов:
                </p>
                
                <!-- ВИДЕО (замени ссылку на свою) -->
                <div class="secret-video">
                    <iframe 
                        src="https://www.youtube.com/embed/ТВОЯ_ССЫЛКА_НА_ВИДЕО" 
                        allowfullscreen>
                    </iframe>
                </div>

                <button class="close-secret" onclick="closeSecretMode()">Закрыть</button>
            </div>

            <!-- Социальные ссылки -->
            <div class="social-links">
                <a href="https://t.me/JakeFantomITGames" target="_blank" class="social-btn"> Telegram</a>
                <a href="https://www.youtube.com/@JakeFantomOfficial" target="_blank" class="social-btn"> YouTube</a>
                <a href="https://www.twitch.tv/jakefantom" target="_blank" class="social-btn"> Twitch</a>
            </div>
        </div>
    </div>

    <script>
        // ========== КАСТОМНЫЙ КУРСОР ==========
        const cursor = document.querySelector('.custom-cursor');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('mousedown', () => {
            cursor.classList.add('click');
        });

        document.addEventListener('mouseup', () => {
            cursor.classList.remove('click');
        });

        // ========== ЧАСТИЦЫ ПРИ КЛИКЕ ==========
        document.addEventListener('click', (e) => {
            createClickParticles(e.clientX, e.clientY);
        });

        function createClickParticles(x, y) {
            const particleCount = 12;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'click-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                document.body.appendChild(particle);

                const angle = (Math.PI * 2 * i) / particleCount;
                const velocity = 50 + Math.random() * 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 600,
                    easing: 'cubic-bezier(0, .9, .57, 1)',
                }).onfinish = () => particle.remove();
            }
        }

        // ========== АНИМАЦИЯ ПЕЧАТАНИЯ ТЕКСТА ==========
        const textToType = "Привет! Твой донат поможет развивать канал и делать стримы еще круче! Каждый вклад - это шаг к новым вершинам. Спасибо, что ты со мной!";
        const typingElement = document.getElementById('typingText');
        let charIndex = 0;

        function typeText() {
            if (charIndex < textToType.length) {
                typingElement.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeText, 30);
            }
        }

        setTimeout(typeText, 500);

        // ========== ПЕРЕКЛЮЧЕНИЕ ПЛАТФОРМ ==========
        function switchPlatform(platform) {
            document.querySelectorAll('.platform-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            event.target.classList.add('active');
            
            document.querySelectorAll('.widget-container').forEach(widget => {
                widget.classList.remove('active');
            });
            
            document.getElementById(platform + '-widget').classList.add('active');
        }

        // ========== МАТРИЧНЫЙ ДОЖДЬ ==========
        const canvas = document.getElementById('skullCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const skulls = ['💀', '🪦', '️'];
        const fontSize = 20;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -100;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(46, 46, 46, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#07eb0f';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = skulls[Math.floor(Math.random() * skulls.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // ========== ПЛАВАЮЩИЕ ЧАСТИЦЫ ==========
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animation = `float ${3 + Math.random() * 4}s ease-in-out infinite`;
                particle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(particle);
            }
        }

        createParticles();

        // ========== СЕКРЕТНЫЙ РЕЖИМ (ТОЛЬКО СТРЕЛКИ) ==========
        const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight'];
        let konamiIndex = 0;

        document.addEventListener('keydown', (e) => {
            if (e.key === konamiCode[konamiIndex]) {
                konamiIndex++;
                if (konamiIndex === konamiCode.length) {
                    activateSecretMode();
                    konamiIndex = 0;
                }
            } else {
                konamiIndex = 0;
            }
        });

        function activateSecretMode() {
            // Показываем секретный контент
            document.getElementById('secretContent').classList.add('active');
            
            // Отключаем кастомный курсор (Вариант B)
            document.body.classList.add('default-cursor');
            
            // Эффект конфетти
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createClickParticles(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight
                    );
                }, i * 50);
            }
        }

        function closeSecretMode() {
            // Скрываем секретный контент
            document.getElementById('secretContent').classList.remove('active');
            
            // Возвращаем кастомный курсор
            document.body.classList.remove('default-cursor');
        }

        // Адаптация canvas при изменении размера окна
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

</body>
</html>
