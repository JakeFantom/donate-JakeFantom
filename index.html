<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jake Fantom | Поддержка стрима</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2e2e2e;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ========== МАТРИЧНЫЙ ДОЖДЬ ========== */
        #skullCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        /* ========== ОСНОВНОЙ КОНТЕЙНЕР ========== */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .content-box {
            background: rgba(46, 46, 46, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #00ff04;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 4, 0.3),
                        inset 0 0 30px rgba(7, 235, 15, 0.1);
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 4, 0.3), inset 0 0 30px rgba(7, 235, 15, 0.1); }
            50% { box-shadow: 0 0 50px rgba(0, 255, 4, 0.5), inset 0 0 50px rgba(7, 235, 15, 0.2); }
        }

        /* ========== АВАТАР ========== */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00ff04;
            box-shadow: 0 0 30px rgba(0, 255, 4, 0.6);
            animation: avatarPulse 2s ease-in-out infinite;
        }

        @keyframes avatarPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0, 255, 4, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(0, 255, 4, 0.8); }
        }

        /* ========== ЧЕРЕПА ДЕКОР ========== */
        .skull-decor {
            position: absolute;
            font-size: 24px;
            color: #07eb0f;
            opacity: 0.6;
            animation: float 4s ease-in-out infinite;
        }

        .skull-decor:nth-child(1) { top: 10px; left: 10px; animation-delay: 0s; }
        .skull-decor:nth-child(2) { top: 10px; right: 10px; animation-delay: 1s; }
        .skull-decor:nth-child(3) { bottom: 10px; left: 10px; animation-delay: 2s; }
        .skull-decor:nth-child(4) { bottom: 10px; right: 10px; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #00ff04;
            text-shadow: 0 0 20px rgba(0, 255, 4, 0.8);
            letter-spacing: 1px;
        }

        .description {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* ========== ПЕРЕКЛЮЧАТЕЛЬ ПЛАТФОРМ ========== */
        .platform-switcher {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .platform-btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 25px;
            border: 2px solid #0da64d;
            background: rgba(0, 0, 0, 0.4);
            color: #07eb0f;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .platform-btn:hover {
            background: rgba(13, 166, 77, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(13, 166, 77, 0.4);
        }

        .platform-btn.active {
            background: #00ff04;
            color: #2e2e2e;
            border-color: #00ff04;
            box-shadow: 0 0 25px rgba(0, 255, 4, 0.8);
            transform: scale(1.05);
        }

        /* ========== БЛОК С ВИДЖЕТАМИ ========== */
        .widget-wrapper {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #0da64d;
            border-radius: 15px;
            padding: 20px;
            margin: 30px 0;
            box-shadow: 0 0 20px rgba(13, 166, 77, 0.3);
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .widget-container {
            width: 100%;
            display: none;
        }

        .widget-container.active {
            display: block;
        }

        .widget-container iframe {
            border-radius: 10px;
            max-width: 100%;
        }

        /* Стили для кнопки DonationAlerts */
        .da-button {
            display: inline-block;
            padding: 20px 40px;
            background: linear-gradient(135deg, #04a54b 0%, #07eb0f 100%);
            color: #2e2e2e;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
            border: 2px solid #00ff04;
            box-shadow: 0 0 30px rgba(0, 255, 4, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .da-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 40px rgba(0, 255, 4, 0.9);
        }

        /* ========== СОЦИАЛЬНЫЕ ССЫЛКИ ========== */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .social-btn {
            text-decoration: none;
            color: #00ff04;
            background: rgba(0, 255, 4, 0.1);
            border: 2px solid #00ff04;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .social-btn:hover {
            background: #00ff04;
            color: #2e2e2e;
            box-shadow: 0 0 25px rgba(0, 255, 4, 0.8);
            transform: translateY(-3px);
        }

        /* ========== ЧАСТИЦЫ ========== */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #07eb0f;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            box-shadow: 0 0 10px #07eb0f;
        }

        /* ========== АДАПТИВНОСТЬ ========== */
        @media (max-width: 600px) {
            .content-box {
                padding: 30px 20px;
            }
            h1 {
                font-size: 24px;
            }
            .avatar-container {
                width: 120px;
                height: 120px;
            }
            .platform-btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas для матричного дождя с черепами -->
    <canvas id="skullCanvas"></canvas>

    <!-- Плавающие частицы -->
    <div id="particles"></div>

    <div class="container">
        <div class="content-box">
            <!-- Декоративные черепа -->
            <div class="skull-decor">💀</div>
            <div class="skull-decor"></div>
            <div class="skull-decor"></div>
            <div class="skull-decor"></div>

            <!-- Аватар -->
            <div class="avatar-container">
                <img src="https://i.imgur.com/zLAns40.png" alt="Jake Fantom Avatar" class="avatar">
            </div>

            <h1> JAKE FANTOM ⚡</h1>
            <p class="description">
                Привет! Твой донат поможет развивать канал и делать стримы еще круче!<br>
                Каждый вклад — это шаг к новым вершинам. Спасибо, что ты с нами! 
            </p>

            <!-- Переключатель платформ -->
            <div class="platform-switcher">
                <button class="platform-btn active" onclick="switchPlatform('donatepay')">
                    💚 DonatePay
                </button>
                <button class="platform-btn" onclick="switchPlatform('donationalerts')">
                    🔔 DonationAlerts
                </button>
            </div>

            <!-- Блок с виджетами -->
            <div class="widget-wrapper">
                <!-- ========== DONATEPAY (АКТИВНЫЙ) ========== -->
                <div id="donatepay-widget" class="widget-container active">
                    <iframe 
                        src="https://widget.donatepay.ru/widgets/page/24b44dc68e48fb37a2f23d99c8e52a1e83f83ce59ca35b9c87a04ee09fd217c3?widget_id=7869312&sum=200" 
                        width="510" 
                        height="220" 
                        frameBorder="0"
                        scrolling="no"
                    ></iframe>
                </div>

                <!-- ========== DONATIONALERTS (ССЫЛКА) ========== -->
                <div id="donationalerts-widget" class="widget-container">
                    <!-- 
                        Если хочешь вернуть старый код - просто раскомментируй его ниже
                        и удали или закомментируй текущий код
                    -->
                    
                    <!-- ВАРИАНТ 1: Красивая кнопка (сейчас активно) -->
                    <a href="https://www.donationalerts.com/r/jakefantom" target="_blank" class="da-button">
                        🔔 Перейти к донату
                    </a>
                    <p style="margin-top: 20px; color: #b0b0b0; font-size: 14px;">
                        Откроется в новой вкладке
                    </p>

                    <!-- 
                    ВАРИАНТ 2: Если хочешь iframe (закомментируй кнопку выше и раскомментируй это):
                    
                    <iframe 
                        src="https://www.donationalerts.com/r/jakefantom" 
                        width="100%" 
                        height="220" 
                        frameBorder="0"
                        scrolling="no"
                    ></iframe>
                    
                    ПРИМЕЧАНИЕ: DonationAlerts может блокировать отображение в iframe
                    -->
                </div>

                <!-- 
                ================================================
                РЕЗЕРВНАЯ КОПИЯ СТАРОГО КОДА (ЗАКОММЕНТИРОВАНО)
                ================================================
                Если что-то пойдет не так, просто удали весь текущий код
                и раскомментируй этот блок:
                
                <div id="donatepay-widget" class="widget-container active">
                    <iframe 
                        src="https://widget.donatepay.ru/widgets/page/24b44dc68e48fb37a2f23d99c8e52a1e83f83ce59ca35b9c87a04ee09fd217c3?widget_id=7869312&sum=200" 
                        width="510" 
                        height="220" 
                        frameBorder="0"
                        scrolling="no"
                    ></iframe>
                </div>
                
                -->
            </div>

            <!-- Социальные ссылки -->
            <div class="social-links">
                <a href="https://t.me/JakeFantomITGames" target="_blank" class="social-btn"> Telegram</a>
                <a href="https://www.youtube.com/@JakeFantomOfficial" target="_blank" class="social-btn"> YouTube</a>
                <a href="https://www.twitch.tv/jakefantom" target="_blank" class="social-btn"> Twitch</a>
            </div>
        </div>
    </div>

    <script>
        // ========== ПЕРЕКЛЮЧЕНИЕ ПЛАТФОРМ ==========
        function switchPlatform(platform) {
            // Убираем active со всех кнопок
            document.querySelectorAll('.platform-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Добавляем active нажатой кнопке
            event.target.classList.add('active');
            
            // Скрываем все виджеты
            document.querySelectorAll('.widget-container').forEach(widget => {
                widget.classList.remove('active');
            });
            
            // Показываем нужный виджет
            document.getElementById(platform + '-widget').classList.add('active');
        }

        // ========== МАТРИЧНЫЙ ДОЖДЬ ==========
        const canvas = document.getElementById('skullCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const skulls = ['💀', '', '☠️'];
        const fontSize = 20;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -100;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(46, 46, 46, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#07eb0f';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = skulls[Math.floor(Math.random() * skulls.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // ========== ПЛАВАЮЩИЕ ЧАСТИЦЫ ==========
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animation = `float ${3 + Math.random() * 4}s ease-in-out infinite`;
                particle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(particle);
            }
        }

        createParticles();

        // Адаптация canvas при изменении размера окна
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        /*
        // ========== РЕЗЕРВНЫЙ КОД JAVASCRIPT ==========
        // Если что-то сломается, можешь использовать старую версию функций
        
        function oldSwitchPlatform(platform) {
            var buttons = document.getElementsByClassName('platform-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            event.target.classList.add('active');
            
            var widgets = document.getElementsByClassName('widget-container');
            for (var i = 0; i < widgets.length; i++) {
                widgets[i].classList.remove('active');
            }
            document.getElementById(platform + '-widget').classList.add('active');
        }
        */
    </script>

</body>
</html>
